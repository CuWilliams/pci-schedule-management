<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power Conditioning Inc. — Weekly Schedule</title>
  <link rel="stylesheet" href="pci-tokens.css">
  <style>
    body {
      background: var(--bg);
      color: var(--text);
    }

    /* ── Topbar (schedule-specific overrides; base in pci-tokens.css) ────── */
    .topbar-logo { flex: 1; text-align: center; font-weight: 900; letter-spacing: 0.10em; }

    /* ── View toggle ──────────────────────────────────────── */
    .view-toggle {
      display: flex;
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .view-btn {
      padding: 4px 10px;
      background: transparent;
      border: none;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.45);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-family: var(--font-body);
    }
    .view-btn + .view-btn { border-left: 1.5px solid rgba(255,255,255,0.18); }
    .view-btn.active { background: var(--brand); color: var(--pci-white); }

    /* ── Admin link (topbar context) ─────────────────────── */
    .topbar-admin {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border: 1.5px solid rgba(255,255,255,0.14);
      border-radius: var(--radius-sm);
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .topbar-admin:hover { border-color: rgba(255,255,255,0.40); color: var(--pci-white); }
    .topbar-admin.logged-in { border-color: var(--success); color: var(--success); }
    .topbar-admin svg { width: 13px; height: 13px; flex-shrink: 0; }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
    }

    /* ── Location tabs ────────────────────────────────────── */
    .location-tabs {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 0 12px;
      position: sticky;
      top: 52px;   /* topbar height */
      z-index: 9;
      display: flex;
      gap: 0;
      /* Scroll rather than wrap — the filter-bar/date-nav sticky offsets below
         assume this strip stays a single ~38px row. */
      overflow-x: auto;
      scrollbar-width: none;
    }
    .location-tabs::-webkit-scrollbar { display: none; }

    @media (max-width: 600px) {
      .location-tabs .loc-tab { padding-left: var(--sp-3); padding-right: var(--sp-3); }
    }

    /* ── Filter bar ───────────────────────────────────────── */
    .filter-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      position: sticky;
      top: 90px;   /* topbar 52 + location-tabs ~38 */
      z-index: 9;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 2px 0;
    }
    .filter-row::-webkit-scrollbar { display: none; }

    /* ── List view ────────────────────────────────────────── */
    .schedule {
      max-width: 600px;
      margin: 0 auto;
      padding: 12px 10px 40px;
    }

    .day-block {
      margin-bottom: 16px;
      background: var(--surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .day-header {
      background: var(--gray-700);
      color: var(--pci-white);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 8px 12px;
    }

    .class-item {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--border);
    }
    .class-item:last-child { border-bottom: none; }

    .class-body { padding: 8px 10px; flex: 1; }

    .class-time {
      font-size: 11px;
      font-weight: 700;
      color: var(--gray-600);
      margin-bottom: 2px;
      letter-spacing: 0.02em;
    }

    .class-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-900);
      line-height: 1.3;
      margin-bottom: 2px;
    }

    .class-instructor {
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
    }

    .spots-left {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
    }
    .spots-left--low { color: var(--warn); font-weight: 600; }

    footer {
      text-align: center;
      font-size: 11px;
      color: var(--gray-400);
      padding: 16px;
    }

    .class-item.hidden  { display: none; }
    .day-block.hidden   { display: none; }
    .class-item[data-type] { cursor: pointer; }
    .class-item[data-type]:hover .class-body { background: rgba(0,0,0,0.02); }
    .class-item.past { opacity: 0.45; }
    .class-item.past[data-type]:hover .class-body { background: transparent; }
    .cal-class-block.past { opacity: 0.45; }
    .cal-class-block.past:hover { opacity: 0.45; }

    .rollcall-cta {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      padding: 4px 8px;
      letter-spacing: 0.02em;
    }

    .team-cta-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--brand);
      padding: 4px 8px;
      letter-spacing: 0.02em;
    }

    /* ── Modal ────────────────────────────────────────────── */
    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
    }

    .modal-desc {
      font-size: 13px;
      line-height: 1.6;
      color: var(--gray-600);
    }

    /* ── Date navigation bar ─────────────────────────────── */
    .date-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 5px 12px;
      position: sticky;
      top: 162px; /* topbar 52 + loc-tabs 38 + filter-bar 72 */
      z-index: 9;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
    }

    .date-nav-label {
      flex: 1;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .date-nav-btn {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      color: var(--text);
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
    }
    .date-nav-btn:hover { background: var(--gray-100); }

    .date-nav-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .date-nav-today-btn {
      background: none;
      border: 1.5px solid var(--brand);
      border-radius: var(--radius-sm);
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--brand);
      cursor: pointer;
      white-space: nowrap;
      font-family: var(--font-body);
    }
    .date-nav-today-btn:hover { background: var(--gray-050); }

    .date-nav-cal-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--gray-500);
      position: relative;
      width: 28px;
      height: 28px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }
    .date-nav-cal-btn:hover { color: var(--text); background: var(--gray-100); }
    .date-nav-cal-btn svg { width: 15px; height: 15px; pointer-events: none; }
    .date-nav-cal-btn input[type="date"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      font-size: 0;
    }

    /* ── List view day header with date ──────────────────── */
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .day-header-date {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.8;
      letter-spacing: 0;
    }
    .day-header--today { background: var(--brand); }

    /* ── Calendar / Week view ─────────────────────────────── */
    #calView { display: none; }

    .cal-day-header-bar {
      display: flex;
      align-items: stretch;
      background: var(--surface);
      border-bottom: 2px solid var(--gray-300);
      position: sticky;
      top: 202px; /* topbar 52 + loc-tabs 38 + filter-bar 72 + date-nav 40 */
      z-index: 8;
      overflow: hidden;
    }

    .cal-gutter-cell {
      width: 44px;
      flex-shrink: 0;
    }

    .cal-day-head {
      flex: 1;
      min-width: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 5px 2px;
    }

    .cal-head-name {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray-600);
    }

    .cal-head-num {
      font-size: 14px;
      font-weight: 700;
      color: var(--gray-800);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .cal-day-head--today .cal-head-name { color: var(--brand); }
    .cal-day-head--today .cal-head-num { background: var(--brand); color: var(--pci-white); }

    .cal-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      padding-bottom: 40px;
    }

    .cal-inner {
      display: flex;
      min-width: 674px;
    }

    .cal-gutter {
      width: 44px;
      flex-shrink: 0;
      position: relative;
    }

    .cal-time-label {
      position: absolute;
      right: 6px;
      font-size: 10px;
      color: var(--gray-400);
      font-weight: 600;
      transform: translateY(-50%);
      white-space: nowrap;
    }

    .cal-day-col {
      flex: 1;
      min-width: 90px;
      position: relative;
      border-left: 1px solid var(--gray-200);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 31px,
        #ececec 31px,
        #ececec 32px,
        transparent 32px,
        transparent 63px,
        #d4d4d4 63px,
        #d4d4d4 64px
      );
      background-size: 100% 64px;
    }

    .cal-class-block {
      position: absolute;
      left: 2px;
      right: 2px;
      border-radius: var(--radius-sm);
      padding: 3px 4px 3px 6px;
      overflow: hidden;
      cursor: pointer;
      border-left-width: 3px;
      border-left-style: solid;
      transition: opacity 0.1s;
    }
    .cal-class-block:hover { opacity: 0.75; }

    .cal-block-time {
      font-size: 9px;
      font-weight: 700;
      color: var(--gray-600);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .cal-block-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--gray-800);
      line-height: 1.25;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .cal-block-gym-tag {
      font-size: 8px;
      font-weight: 700;
      color: var(--gray-600);
      margin-top: 2px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .cal-class-block.hidden { display: none; }

    /* ── My Bookings view ───────────────────────────────── */
    #myBookings {
      max-width: 600px;
      margin: 0 auto;
      padding: 12px 10px 40px;
    }
    .my-bookings-heading {
      font-size: 14px;
      font-weight: 700;
      color: var(--gray-700);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: var(--sp-4);
    }
    .my-bookings-empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      font-size: 14px;
    }
    .my-bookings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--sp-4);
    }
    #mbCalDayHeaderBar {
      position: static; /* override sticky from .cal-day-header-bar */
    }
  </style>
</head>
<body>
<div id="phoneFrame">
<div id="descModal" class="modal-overlay" role="dialog" aria-modal="true" hidden>
  <div class="modal-sheet">
    <div class="modal-header">
      <span id="modalTitle" class="modal-title"></span>
      <button class="modal-close" id="modalClose" aria-label="Close">&#x2715;</button>
    </div>
    <p id="modalDesc" class="modal-desc"></p>
  </div>
</div>
<!-- ── Booking confirmation modal ────────────────────────────────────────── -->
<div id="bookModal" class="modal-overlay" role="dialog" aria-modal="true" hidden>
  <div class="modal-sheet">
    <div class="modal-header">
      <span class="modal-title">Confirm Booking</span>
      <button class="modal-close" id="bookModalClose" aria-label="Close">&#x2715;</button>
    </div>
    <div style="padding:12px 16px 4px">
      <p id="bookModalClass" style="font-weight:700;font-size:14px;color:var(--text);margin-bottom:6px"></p>
      <p id="bookModalTime" style="font-size:12px;color:var(--muted);margin-bottom:14px"></p>
      <p id="bookModalCost" style="font-size:13px;color:var(--text);margin-bottom:20px"></p>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" id="bookModalConfirm" style="flex:1">Confirm Booking</button>
        <button class="btn btn-ghost" id="bookModalCancel">Cancel</button>
      </div>
    </div>
  </div>
</div>
<!-- ── Cancel booking confirmation modal ─────────────────────────────────── -->
<div id="cancelModal" class="modal-overlay" role="dialog" aria-modal="true" hidden>
  <div class="modal-sheet">
    <div class="modal-header">
      <span class="modal-title">Cancel Booking?</span>
      <button class="modal-close" id="cancelModalClose" aria-label="Close">&#x2715;</button>
    </div>
    <div style="padding:12px 16px 4px">
      <p id="cancelModalClass" style="font-weight:700;font-size:14px;color:var(--text);margin-bottom:6px"></p>
      <p id="cancelModalTime" style="font-size:12px;color:var(--muted);margin-bottom:14px"></p>
      <p id="cancelModalRefund" style="font-size:13px;color:var(--text);margin-bottom:20px"></p>
      <div style="display:flex;gap:8px">
        <button class="btn btn-danger" id="cancelModalConfirm" style="flex:1">Cancel Booking</button>
        <button class="btn btn-ghost" id="cancelModalKeep">Keep</button>
      </div>
    </div>
  </div>
</div>
<!-- ── Member menu bottom sheet ───────────────────────────────────────────── -->
<div id="memberMenuModal" class="modal-overlay" role="dialog" aria-modal="true" hidden>
  <div class="modal-sheet" style="padding:0;overflow:hidden">
    <div class="member-menu-title">
      <div>
        <div class="member-menu-name" id="menuUserName"></div>
        <div class="member-menu-email" id="menuUserEmail"></div>
      </div>
      <button class="modal-close" id="memberMenuClose" aria-label="Close">&#x2715;</button>
    </div>
    <div class="member-menu-list" id="memberMenuList"></div>
  </div>
</div>
<div id="phoneViewport">

      Ascend Studio

    <a class="nav-drawer-item" href="admin.html">

</header>

<div class="location-tabs" id="locationTabs">
  <button class="loc-tab active" data-loc="stjohns">St. John's</button>
  <button class="loc-tab" data-loc="clarenville">Clarenville</button>
  <button class="loc-tab" data-loc="ascend">Ascend</button>
</div>

<div class="filter-bar" id="filterBar">
  <div class="filter-row" id="filterCategories"></div>
  <div class="filter-row" id="filterInstructors"></div>
</div>

<div class="date-nav" id="dateNav">
  <button class="date-nav-btn" id="prevWeek" aria-label="Previous week">&#8249;</button>
  <span class="date-nav-label" id="dateNavLabel"></span>
  <button class="date-nav-btn" id="nextWeek" aria-label="Next week">&#8250;</button>
  <div class="date-nav-right">

const DEV_MODE_KEY = 'pci_dev_mobile';
function applyDevMode(enabled) {
  document.body.classList.toggle('dev-mobile', enabled);
  const btn = document.getElementById('devModeBtn');
  if (btn) {
    btn.classList.toggle('active', enabled);
    if (enabled && btn.closest('#phoneFrame')) {
      btn._devPrevParent = btn.parentNode;
      btn._devPrevNext = btn.nextSibling;
      document.body.appendChild(btn);
    } else if (!enabled && btn._devPrevParent) {
      btn._devPrevParent.insertBefore(btn, btn._devPrevNext || null);
      btn._devPrevParent = null;
      btn._devPrevNext = null;
    }
  }
  enabled
    ? localStorage.setItem(DEV_MODE_KEY, '1')
    : localStorage.removeItem(DEV_MODE_KEY);
}
applyDevMode(localStorage.getItem(DEV_MODE_KEY) === '1');
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('devModeBtn')?.addEventListener('click', () => {
    applyDevMode(!document.body.classList.contains('dev-mobile'));

});

// ── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = ('show' + (type ? ' ' + type : '')).trim();
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, 3200);
}

// ── Bookings store helpers ───────────────────────────────────────────────────
function getBookings() {
  try { return JSON.parse(localStorage.getItem(BOOKINGS_KEY)) || []; } catch { return []; }
}
function saveBookings(arr) {
  localStorage.setItem(BOOKINGS_KEY, JSON.stringify(arr));
}
function spotsRemaining(cls) {
  const booked = getBookings().filter(b => b.class_id === cls.id && b.status === 'booked').length;
  return cls.capacity - booked;
}

// ── Booking CTA builder ──────────────────────────────────────────────────────
function buildBookingCTA(cls) {
  const session = PciAuth.getSession();
  const wrapper = document.createElement('div');
  wrapper.className = 'class-actions';

  // Team-booked slots (e.g. a sports team's block reservation) aren't open to individual
  // booking — but an instructor of record still gets the Roll Call affordance below.
  const isOwnInstructor = session && session.role === 'instructor' &&
    (cls.instructor_ids || []).includes(session.instructorId);
  if (cls.booking_mode === 'team' && !isOwnInstructor) {
    const label = document.createElement('div');
    label.className = 'team-cta-label';
    label.textContent = 'Team Booking' + (cls.team_name ? ' — ' + cls.team_name : '');
    return label;
  }

  if (!session) {
    const a = document.createElement('a');
    a.href = 'login.html?redirect=' + encodeURIComponent(location.href);
    a.className = 'btn btn-outline btn-sm';
    a.textContent = 'Sign In to Book';
    wrapper.appendChild(a);
    return wrapper;
  }

  if (session.role === 'member') {
    const alreadyBooked = getBookings().some(
      b => b.class_id === cls.id && b.user_id === session.userId && b.status === 'booked'
    );
    if (alreadyBooked) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-booked btn-sm booked-btn';
      btn.dataset.classId = cls.id;
      btn.dataset.classTitle = displayTitle(cls);
      btn.dataset.classTime = formatTime(cls.time_start) + ' – ' + formatTime(cls.time_end);
      btn.textContent = 'Booked';
      wrapper.appendChild(btn);
    } else {
      const remaining = spotsRemaining(cls);
      if (remaining <= 0) {
        const btn = document.createElement('button');
        btn.className = 'btn btn-outline btn-sm';
        btn.disabled = true;
        btn.title = 'This class is full';
        btn.textContent = 'Full';
        wrapper.appendChild(btn);
      } else {
        // One resolution drives the button; the same call re-runs at commit.
        const entry = resolveCoverage(cls, session);
        const hasAnyPackage = (session.packages || []).length > 0;

        if (entry) {
          const btn = document.createElement('button');
          btn.className = 'btn btn-primary btn-sm book-btn';
          btn.dataset.classId    = cls.id;
          btn.dataset.classTitle = displayTitle(cls);
          btn.dataset.classTime  = formatTime(cls.time_start) + ' – ' + formatTime(cls.time_end);
          btn.dataset.pipeline   = entry.type === 'unlimited' ? 'unlimited' : 'credits';
          btn.dataset.walletId   = entry.wallet_id;
          btn.textContent = 'Book';
          wrapper.appendChild(btn);
        } else if (hasAnyPackage) {
          const btn = document.createElement('button');
          btn.className = 'btn btn-outline btn-sm';
          btn.disabled = true;
          btn.title = coverageDenialReason(cls, session);
          btn.textContent = 'Not Covered';
          wrapper.appendChild(btn);
        } else {
          const a = document.createElement('a');
          a.href = 'buy-credits.html';
          a.className = 'btn btn-outline btn-sm';
          a.textContent = 'Buy Credits';
          wrapper.appendChild(a);
        }

        const spotsLabel = document.createElement('div');
        spotsLabel.className = 'spots-left' + (remaining <= 3 ? ' spots-left--low' : '');
        spotsLabel.textContent = remaining + (remaining === 1 ? ' spot left' : ' spots left');
        wrapper.appendChild(spotsLabel);
      }
    }
  }
  // Instructor: show Roll Call affordance for own classes (not inside .class-actions so click reaches the item handler)
  if (session.role === 'instructor' && (cls.instructor_ids || []).includes(session.instructorId)) {
    const badge = document.createElement('div');
    badge.className = 'rollcall-cta';
    badge.textContent = 'Roll Call →';
    return badge;
  }

  return wrapper;
}

// ── Booking modal state ──────────────────────────────────────────────────────
let _pendingBooking = null;

function openBookModal(classId, classTitle, classTime, pipeline, walletId) {
  _pendingBooking = { classId, classTitle, classTime, pipeline: pipeline || 'credits', walletId };
  document.getElementById('bookModalClass').textContent = classTitle;
  document.getElementById('bookModalTime').textContent = classTime;

  // Name the package that will pay, so a member holding several knows which
  // one this booking draws down.
  const session = PciAuth.getSession();
  const entry = (session && session.packages || []).find(e => e.wallet_id === walletId);
  const costEl = document.getElementById('bookModalCost');
  if (!entry) {
    costEl.textContent = '1 credit will be deducted from your balance.';
  } else if (entry.type === 'unlimited') {
    costEl.textContent = 'Covered by your ' + entry.name + ' — no credits used.';
  } else {
    costEl.textContent = '1 credit will be deducted from your ' + entry.name +
      ' (' + entry.credits_remaining + ' remaining).';
  }

  document.getElementById('bookModal').removeAttribute('hidden');
}

function closeBookModal() {
  document.getElementById('bookModal').setAttribute('hidden', '');
  _pendingBooking = null;
}

document.getElementById('bookModalClose').addEventListener('click', closeBookModal);
document.getElementById('bookModalCancel').addEventListener('click', closeBookModal);
document.getElementById('bookModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeBookModal();
});

// Returns a credit to the exact package that paid for the booking, and returns
// the toast message describing what happened. Unlimited bookings cost nothing
// so they refund nothing; an expired package can't take a credit back either.
// Shared by both cancel paths so neither can hand out a free credit.
function refundBooking(booking) {
  if (booking.pipeline === 'unlimited') return 'Booking cancelled.';
  if (!booking.wallet_id) {
    // Pre-wallet booking — no package to refund to.
    return 'Booking cancelled.';
  }
  const refunded = PciAuth.refundToWallet(booking.wallet_id);
  return refunded
    ? 'Booking cancelled. 1 credit restored.'
    : 'Booking cancelled. That package has expired, so the credit could not be restored.';
}

// ── Cancel modal state ───────────────────────────────────────────────────────
let _pendingCancelClassId = null;

function openCancelModal(classId, classTitle, classTime) {
  _pendingCancelClassId = classId;
  document.getElementById('cancelModalClass').textContent = classTitle;
  document.getElementById('cancelModalTime').textContent = classTime;

  // Only a credit booking gets a credit back, and only to the package that paid.
  const session = PciAuth.getSession();
  const booking = session && getBookings().find(
    b => b.class_id === classId && b.user_id === session.userId && b.status === 'booked'
  );
  document.getElementById('cancelModalRefund').textContent = describeRefund(booking, session);

  document.getElementById('cancelModal').removeAttribute('hidden');
}

// What the member will get back, phrased for a confirm prompt.
function describeRefund(booking, session) {
  if (!booking || booking.pipeline === 'unlimited') {
    return 'Your spot will be released. No credits were used for this booking.';
  }
  const entry = (session && session.packages || []).find(e => e.wallet_id === booking.wallet_id);
  if (!entry) return '1 credit will be restored to your balance.';
  if (!isWalletEntryActive(entry)) {
    return 'Your ' + entry.name + ' has expired, so the credit cannot be restored.';
  }
  return '1 credit will be restored to your ' + entry.name + '.';
}

function closeCancelModal() {
  document.getElementById('cancelModal').setAttribute('hidden', '');
  _pendingCancelClassId = null;
}

document.getElementById('cancelModalClose').addEventListener('click', closeCancelModal);
document.getElementById('cancelModalKeep').addEventListener('click', closeCancelModal);
document.getElementById('cancelModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeCancelModal();
});

document.getElementById('cancelModalConfirm').addEventListener('click', () => {
  if (!_pendingCancelClassId) return;
  const session = PciAuth.getSession();
  if (!session) { closeCancelModal(); return; }

  const bookings = getBookings();
  const idx = bookings.findIndex(
    b => b.class_id === _pendingCancelClassId && b.user_id === session.userId && b.status === 'booked'
  );
  if (idx === -1) { closeCancelModal(); return; }
  const cancelled = bookings[idx];
  bookings.splice(idx, 1);
  saveBookings(bookings);

  closeCancelModal();
  showToast(refundBooking(cancelled), 'success');
  refreshBookingCTAs();
});

document.getElementById('bookModalConfirm').addEventListener('click', () => {
  if (!_pendingBooking) return;
  const session = PciAuth.getSession();
  if (!session) { closeBookModal(); return; }

  const cls = _allClasses.find(c => c.id === _pendingBooking.classId);

  // Re-check capacity as guard before committing
  if (cls && spotsRemaining(cls) <= 0) {
    showToast('This class just filled up.', 'error');
    closeBookModal();
    return;
  }

  // Re-resolve coverage from the wallet rather than trusting the button's
  // dataset — a tampered or stale CTA must never buy a class the member's
  // packages don't cover.
  const entry = cls ? resolveCoverage(cls, session) : null;
  if (!entry) {
    showToast(cls ? coverageDenialReason(cls, session) : 'This class is no longer bookable.', 'error');
    closeBookModal();
    return;
  }
  const pipeline = entry.type === 'unlimited' ? 'unlimited' : 'credits';

  // Check for duplicate booking
  const bookings = getBookings();
  const already = bookings.find(b => b.class_id === _pendingBooking.classId && b.user_id === session.userId && b.status === 'booked');
  if (already) {
    closeBookModal();
    return;
  }

  // Deduct from the resolved package (no-op for an unlimited pass)
  try {
    PciAuth.spendFromWallet(entry.wallet_id);
  } catch (e) {
    showToast(e.message, 'error');
    closeBookModal();
    return;
  }

  const record = {
    id:            'bkg_' + Date.now() + '_' + session.userId,
    user_id:       session.userId,
    class_id:      _pendingBooking.classId,
    class_title:   _pendingBooking.classTitle,
    location_id:   session.locationId || '',
    booked_at:     Date.now(),
    status:        'booked',
    attended:      null,
    pipeline:      pipeline,
    credits_spent: pipeline === 'unlimited' ? 0 : 1,
    // Which package paid — so cancelling refunds to that exact package.
    wallet_id:     entry.wallet_id,
    package_id:    entry.package_id
  };
  bookings.push(record);
  saveBookings(bookings);

  closeBookModal();
  showToast('Booked! Enjoy your class.', 'success');
  refreshBookingCTAs();
});

// Re-render all booking CTAs after a booking (credit count changed)
function refreshBookingCTAs() {
  document.querySelectorAll('.class-actions').forEach(el => {
    const item = el.closest('.class-item');
    if (!item) return;
    const classId = item.dataset.classId;
    if (!classId) return;
    // Find the class object by id across the cached schedule
    const cls = _allClasses.find(c => c.id === classId);
    if (!cls) return;
    const newCTA = buildBookingCTA(cls);
    el.replaceWith(newCTA);
  });
}

// ── Member menu ──────────────────────────────────────────────────────────────
const memberMenuModal = document.getElementById('memberMenuModal');

function openMemberMenu() {
  if (memberMenuModal) memberMenuModal.removeAttribute('hidden');
}
function closeMemberMenu() {

}

document.getElementById('userChip')?.addEventListener('click', openMemberMenu);
document.getElementById('memberMenuClose')?.addEventListener('click', closeMemberMenu);
memberMenuModal?.addEventListener('click', e => {

// My Bookings item switches view and closes menu
memberMenuModal?.addEventListener('click', e => {

// ── My Bookings renderer ─────────────────────────────────────────────────────

let _myBookingsView = 'list';

function toggleMyBookingsView(view) {
  _myBookingsView = view;
  renderMyBookings();
}

function renderMyBookings() {
  const container = document.getElementById('myBookings');
  container.innerHTML = '';

  const session = PciAuth.getSession();
  if (!session) {
    const msg = document.createElement('div');
    msg.className = 'my-bookings-empty';
    msg.textContent = 'Sign in to see your bookings.';
    container.appendChild(msg);
    return;
  }

  const header = document.createElement('div');
  header.className = 'my-bookings-header';

  const heading = document.createElement('div');
  heading.className = 'my-bookings-heading';
  heading.textContent = 'My Bookings';

  const subToggle = document.createElement('div');
  subToggle.className = 'view-toggle';
  ['list', 'week'].forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'view-btn' + (_myBookingsView === v ? ' active' : '');
    btn.textContent = v === 'list' ? 'List' : 'Week';
    btn.addEventListener('click', () => toggleMyBookingsView(v));
    subToggle.appendChild(btn);
  });

  header.appendChild(heading);
  header.appendChild(subToggle);
  container.appendChild(header);

  const userBookings = getBookings().filter(b => b.user_id === session.userId && b.status === 'booked');
  const classById = {};
  _allClasses.forEach(c => { classById[c.id] = c; });
  const dateWindow = buildDateWindow(_viewStartDate);

  if (_myBookingsView === 'week') {
    renderMyBookingsCalendar(container, dateWindow, userBookings, classById);
  } else {
    renderMyBookingsList(container, dateWindow, userBookings, classById);
  }
}

function renderMyBookingsList(container, dateWindow, userBookings, classById) {
  let hasAny = false;

  dateWindow.forEach(entry => {
    const dayPrefix = entry.dayName.slice(0, 3).toLowerCase();
    const dayBookings = userBookings
      .filter(b => b.class_id && b.class_id.startsWith(dayPrefix + '_'))
      .sort((a, b) => {
        const ca = classById[a.class_id], cb = classById[b.class_id];
        return (ca ? ca.time_start : '').localeCompare(cb ? cb.time_start : '');
      });
    if (dayBookings.length === 0) return;
    hasAny = true;

    const block = document.createElement('div');
    block.className = 'day-block';

    const hdr = document.createElement('div');
    hdr.className = 'day-header' + (entry.isToday ? ' day-header--today' : '');
    const labelSpan = document.createElement('span');
    labelSpan.textContent = entry.isToday ? 'Today' : (DAY_ABBREVS[entry.dayName] || entry.dayName);
    const dateSpan = document.createElement('span');
    dateSpan.className = 'day-header-date';
    dateSpan.textContent = entry.isToday
      ? (DAY_ABBREVS[entry.dayName] || entry.dayName) + ', ' + formatShortDate(entry.date)
      : formatShortDate(entry.date);
    hdr.appendChild(labelSpan);
    hdr.appendChild(dateSpan);
    block.appendChild(hdr);

    dayBookings.forEach(booking => {
      const cls = classById[booking.class_id];
      const cat = cls ? (typeToCategory[cls.type] || { id: 'unknown', color: 'gray' }) : { id: 'unknown', color: 'gray' };
      const instColor = cls ? (instructorColorMap[(cls.instructor_ids || [])[0]] || 'gray') : 'gray';
      const expired = cls ? isClassExpired(cls, entry) : false;

      const item = document.createElement('div');
      item.className = `class-item bg-${cat.color}${expired ? ' past' : ''}`;

      const bar = document.createElement('div');
      bar.className = `color-bar inst-${instColor}`;

      const body = document.createElement('div');
      body.className = 'class-body';

      const time = document.createElement('div');
      time.className = 'class-time';
      time.textContent = cls ? `${formatTime(cls.time_start)} – ${formatTime(cls.time_end)}` : '';

      const title = document.createElement('div');
      title.className = 'class-title';
      title.textContent = cls ? displayTitle(cls) : booking.class_title;

      body.appendChild(time);
      body.appendChild(title);

      if (cls) {
        const instructor = document.createElement('div');
        instructor.className = 'class-instructor';
        const names = cls.instructor_ids
          ? cls.instructor_ids.map(id => instructorMap[id] || id)
          : (cls.instructors || []);
        instructor.textContent = 'With ' + names.join(', ');
        body.appendChild(instructor);
      }

      const actions = document.createElement('div');
      actions.className = 'class-actions';
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn btn-outline btn-sm';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', e => { e.stopPropagation(); cancelBooking(booking.id); });
      actions.appendChild(cancelBtn);

      item.appendChild(bar);
      item.appendChild(body);
      item.appendChild(actions);
      block.appendChild(item);
    });

    container.appendChild(block);
  });

  if (!hasAny) {
    const empty = document.createElement('div');
    empty.className = 'my-bookings-empty';
    empty.textContent = "You haven't booked any classes yet.";
    container.appendChild(empty);
  }
}

function renderMyBookingsCalendar(container, dateWindow, userBookings, classById) {
  const headerBar = document.createElement('div');
  headerBar.className = 'cal-day-header-bar';
  headerBar.id = 'mbCalDayHeaderBar';

  const gutterCell = document.createElement('div');
  gutterCell.className = 'cal-gutter-cell';
  headerBar.appendChild(gutterCell);

  dateWindow.forEach(entry => {
    const cell = document.createElement('div');
    cell.className = 'cal-day-head' + (entry.isToday ? ' cal-day-head--today' : '');
    const nameEl = document.createElement('span');
    nameEl.className = 'cal-head-name';
    nameEl.textContent = entry.isToday ? 'Today' : (DAY_ABBREVS[entry.dayName] || entry.dayName.slice(0, 3));
    const numEl = document.createElement('span');
    numEl.className = 'cal-head-num';
    numEl.textContent = entry.date.getDate();
    cell.appendChild(nameEl);
    cell.appendChild(numEl);
    headerBar.appendChild(cell);
  });
  container.appendChild(headerBar);

  const scroll = document.createElement('div');
  scroll.className = 'cal-scroll';
  scroll.id = 'mbCalScroll';

  const inner = document.createElement('div');
  inner.className = 'cal-inner';

  const totalHeight = TOTAL_HOURS * HOUR_HEIGHT;

  const gutter = document.createElement('div');
  gutter.className = 'cal-gutter';
  gutter.style.height = `${totalHeight}px`;
  for (let h = HOUR_START; h < HOUR_END; h++) {
    const label = document.createElement('div');
    label.className = 'cal-time-label';
    label.style.top = `${(h - HOUR_START) * HOUR_HEIGHT}px`;
    if (h === 12)    label.textContent = '12 PM';
    else if (h < 12) label.textContent = `${h} AM`;
    else             label.textContent = `${h - 12} PM`;
    gutter.appendChild(label);
  }
  inner.appendChild(gutter);

  dateWindow.forEach(entry => {
    const dayPrefix = entry.dayName.slice(0, 3).toLowerCase();
    const dayBookings = userBookings.filter(b => b.class_id && b.class_id.startsWith(dayPrefix + '_'));
    const dayClasses = dayBookings.map(b => classById[b.class_id]).filter(Boolean);

    const col = document.createElement('div');
    col.className = 'cal-day-col';
    col.style.height = `${totalHeight}px`;

    const byLoc = {};
    dayClasses.forEach(c => (byLoc[c.location_id] = byLoc[c.location_id] || []).push(c));
    Object.values(byLoc).forEach(locClasses => assignLanes(locClasses));

    dayBookings.forEach(booking => {
      const cls = classById[booking.class_id];
      if (!cls) return;

      const [sh, sm] = cls.time_start.split(':').map(Number);
      const [eh, em] = cls.time_end.split(':').map(Number);
      const startMin = Math.max(0, sh * 60 + sm - HOUR_START * 60);
      const endMin   = Math.min(TOTAL_HOURS * 60, eh * 60 + em - HOUR_START * 60);
      if (startMin >= endMin) return;

      const topPx    = (startMin / 60) * HOUR_HEIGHT;
      const heightPx = Math.max(((endMin - startMin) / 60) * HOUR_HEIGHT, 22);

      const cat = typeToCategory[cls.type] || { id: 'unknown', color: 'gray' };
      const instColor = instructorColorMap[(cls.instructor_ids || [])[0]] || 'gray';

      const block = document.createElement('div');
      block.className = `cal-class-block color-${cat.color} inst-${instColor}`;
      block.dataset.type = cls.type || '';
      block.dataset.classId = cls.id;
      block.dataset.dayName = entry.dayName;
      block.style.top    = `${topPx}px`;
      block.style.height = `${heightPx}px`;

      const pct = 100 / (cls._totalLanes || 1);
      block.style.left  = `calc(${(cls._lane || 0) * pct}% + 2px)`;
      block.style.width = `calc(${pct}% - 4px)`;
      block.style.right = '';

      const timeEl = document.createElement('div');
      timeEl.className = 'cal-block-time';
      timeEl.textContent = formatTime(cls.time_start);

      const titleEl = document.createElement('div');
      titleEl.className = 'cal-block-title';
      titleEl.textContent = displayTitle(cls);

      block.appendChild(timeEl);
      block.appendChild(titleEl);

      if (cls.sub_location === 'upper_gym') {
        const tag = document.createElement('div');
        tag.className = 'cal-block-gym-tag';
        tag.textContent = '↑ Upper';
        block.appendChild(tag);
      }

      col.appendChild(block);
    });

    inner.appendChild(col);
  });

  scroll.appendChild(inner);
  container.appendChild(scroll);

  scroll.addEventListener('scroll', function () { headerBar.scrollLeft = this.scrollLeft; });
}

document.getElementById('myBookings').addEventListener('click', e => {
  const block = e.target.closest('.cal-class-block[data-type]');
  if (!block) return;
  openModal(block.dataset.type, block.querySelector('.cal-block-title')?.textContent || '');
});

function cancelBooking(bookingId) {
  const bookings = getBookings();
  const idx = bookings.findIndex(b => b.id === bookingId);
  if (idx === -1) return;
  const cancelled = bookings[idx];
  bookings.splice(idx, 1);
  saveBookings(bookings);
  const msg = refundBooking(cancelled);
  renderMyBookings();
  showToast(msg, 'success');
}

// Cache of all class objects for CTA refresh (populated in data load)
let _allClasses = [];

// ── Package eligibility ──────────────────────────────────────────────────────
// Resolution is delegated entirely to selectWalletEntry() in pci-shared.js, so
// the CTA, the confirm modal, and the commit-time guard can never disagree
// about which package pays. Uses the typeToCategory map populated during data
// load (declared at line ~1316).

function classCategoryId(cls) {
  return getClassCategoryId(cls, typeToCategory);
}

function categoryName(catId) {
  const cat = (_allCategories || []).find(c => c.id === catId);
  return cat ? cat.name : catId;
}

// Returns the wallet entry that will cover this class, or null if none does.
function resolveCoverage(cls, session) {
  return selectWalletEntry(session.packages, classCategoryId(cls));
}

// Explains why a member can't book — names the class category and what they
// actually hold, rather than a bare "Not Covered".
function coverageDenialReason(cls, session) {
  const wanted = categoryName(classCategoryId(cls));
  const held   = walletCategories(session.packages).map(categoryName);
  if (!held.length) return 'You have no active package that covers ' + wanted + ' classes.';
  return 'Your ' + held.join(' / ') + ' package doesn\'t cover ' + wanted + ' classes.';
}

// Pre-select location from URL param (?loc=stjohns | ?loc=clarenville | ?loc=ascend)
const _urlLoc = new URLSearchParams(location.search).get('loc');
const _initialLocation = ['clarenville', 'ascend'].includes(_urlLoc) ? _urlLoc : 'stjohns';

let classDescriptions = {};
let instructorMap = {};

const DAY_ABBREVS = {
  Sunday: 'Sun', Monday: 'Mon', Tuesday: 'Tue', Wednesday: 'Wed',
  Thursday: 'Thu', Friday: 'Fri', Saturday: 'Sat'
};
const DAY_NAMES_FULL  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_ABBREVS   = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WEEK_DATE_KEY   = 'pci_sched_date';

// ── Week navigation state ────────────────────────────────────────────────────
let _scheduleByDay  = {};
let _viewStartDate  = todayMidnight(); // overridden by initViewDate() after data loads

function todayMidnight() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function isClassExpired(cls, entry) {
  const today = todayMidnight();
  if (entry.date < today) return true;
  if (entry.date > today) return false;
  const [eh, em] = cls.time_end.split(':').map(Number);
  const classEnd = new Date(today);
  classEnd.setHours(eh, em, 0, 0);
  return new Date() >= classEnd;
}

function dateAddDays(base, n) {
  const d = new Date(base);
  d.setDate(d.getDate() + n);
  return d;
}

function formatShortDate(d) {
  return MONTH_ABBREVS[d.getMonth()] + ' ' + d.getDate();
}

function buildDateWindow(startDate) {
  const today = todayMidnight();
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(startDate);
    d.setDate(d.getDate() + i);
    d.setHours(0, 0, 0, 0);
    const dayName = DAY_NAMES_FULL[d.getDay()];
    const isToday = d.getTime() === today.getTime();
    return { date: d, dayName, isToday };
  });
}

function isCurrentWeek(startDate) {
  const d = new Date(startDate);
  d.setHours(0, 0, 0, 0);
  return d.getTime() === todayMidnight().getTime();
}

function initViewDate() {
  try {
    const stored = sessionStorage.getItem(WEEK_DATE_KEY);
    if (stored) {
      const d = new Date(stored + 'T00:00:00');
      if (!isNaN(d.getTime())) { _viewStartDate = d; _viewStartDate.setHours(0,0,0,0); return; }
    }
  } catch(e) {}
  _viewStartDate = todayMidnight();
}

function saveViewDate() {
  try {
    const y = _viewStartDate.getFullYear();
    const m = String(_viewStartDate.getMonth() + 1).padStart(2, '0');
    const day = String(_viewStartDate.getDate()).padStart(2, '0');
    sessionStorage.setItem(WEEK_DATE_KEY, `${y}-${m}-${day}`);
  } catch(e) {}
}

function updateDateNav(dateWindow) {
  const start = dateWindow[0].date;
  const end   = dateWindow[6].date;
  document.getElementById('dateNavLabel').textContent =
    formatShortDate(start) + ' – ' + formatShortDate(end);

  const todayBtn = document.getElementById('goToToday');
  if (todayBtn) todayBtn.hidden = isCurrentWeek(_viewStartDate);

  const y = start.getFullYear();
  const m = String(start.getMonth() + 1).padStart(2, '0');
  const d = String(start.getDate()).padStart(2, '0');
  const picker = document.getElementById('datePicker');
  if (picker) picker.value = `${y}-${m}-${d}`;
}

const HOUR_START  = 5;
const HOUR_END    = 21;
const HOUR_HEIGHT = 64;
const TOTAL_HOURS = HOUR_END - HOUR_START;

function formatTime(t) {
  const [h, m] = t.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const hour = h % 12 || 12;
  return `${hour}:${m.toString().padStart(2,'0')} ${period}`;
}

function displayTitle(cls) {
  return cls.title
    .replace(/^St\.\s*John's\s+/i, '')
    .replace(/^Clarenville\s+/i, '');
}

function openModal(typeKey, classTitle) {
  const desc = classDescriptions[typeKey];
  if (!desc) return;
  document.getElementById('modalTitle').textContent = classTitle;
  document.getElementById('modalDesc').textContent = desc.description;
  document.getElementById('descModal').removeAttribute('hidden');
}

function closeModal() {
  document.getElementById('descModal').setAttribute('hidden', '');
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('descModal').addEventListener('click', e => {

document.addEventListener('keydown', e => {

let activeLocation = 'stjohns';
const locationCategories  = { stjohns: new Set(), clarenville: new Set(), ascend: new Set() };
const locationInstructors = { stjohns: new Set(), clarenville: new Set(), ascend: new Set() };

function setLocation(loc) {
  activeLocation = loc;
  activeCategories.clear();
  activeInstructors.clear();

  document.querySelectorAll('.loc-tab').forEach(t => {

// ── Filter bar ───────────────────────────────────────────

let activeCategories   = new Set();
let activeInstructors  = new Set();
let typeToCategory     = {};
let _allCategories     = [];
let instructorColorMap = {};

function _syncAllPill() {
  const allClear = activeCategories.size === 0 && activeInstructors.size === 0;
  document.querySelectorAll('.filter-pill[data-all-pill]').forEach(p => p.classList.toggle('active', allClear));
}

function buildCategoryFilter(categoriesData) {
  const row = document.getElementById('filterCategories');

  const clearPill = document.createElement('button');
  clearPill.className = 'filter-pill active';
  clearPill.dataset.allPill = 'true';
  clearPill.textContent = 'All';
  row.appendChild(clearPill);

  categoriesData.categories.forEach(cat => {
    const pill = document.createElement('button');
    pill.className = 'filter-pill';
    pill.dataset.category = cat.id;

    const dot = document.createElement('span');
    dot.className = 'pill-dot';
    dot.style.backgroundColor = COLOR_HEX[cat.color] || '#999';

    pill.appendChild(dot);
    pill.appendChild(document.createTextNode(cat.name));
    row.appendChild(pill);
  });

  row.addEventListener('click', e => {
    const pill = e.target.closest('.filter-pill');
    if (!pill) return;

    if (pill.dataset.allPill) {
      activeCategories.clear();
      activeInstructors.clear();
      document.querySelectorAll('.filter-pill[data-category]').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.filter-pill[data-instructor]').forEach(p => p.classList.remove('active'));
    } else {
      const catId = pill.dataset.category;
      if (activeCategories.has(catId)) activeCategories.delete(catId);
      else activeCategories.add(catId);
      document.querySelectorAll('.filter-pill[data-category]').forEach(p => {
        p.classList.toggle('active', activeCategories.has(p.dataset.category));
      });
    }

    _syncAllPill();
    applyFilter();
  });
}

function buildInstructorFilter(instructors) {
  const row = document.getElementById('filterInstructors');

  instructors.forEach(inst => {
    const pill = document.createElement('button');
    pill.className = 'filter-pill';
    pill.dataset.instructor = inst.id;

    const dot = document.createElement('span');
    dot.className = 'pill-dot';
    dot.style.backgroundColor = INSTRUCTOR_HEX[inst.color] || '#999';

    pill.appendChild(dot);
    pill.appendChild(document.createTextNode(inst.display_name));
    row.appendChild(pill);
  });

  row.addEventListener('click', e => {
    const pill = e.target.closest('.filter-pill');
    if (!pill) return;

    const instId = pill.dataset.instructor;
    if (activeInstructors.has(instId)) activeInstructors.delete(instId);
    else activeInstructors.add(instId);

    document.querySelectorAll('.filter-pill[data-instructor]').forEach(p => {
      p.classList.toggle('active', activeInstructors.has(p.dataset.instructor));
    });

    _syncAllPill();
    applyFilter();
  });
}

function applyFilter() {
  document.querySelectorAll('.day-block').forEach(block => {
    const items = block.querySelectorAll('.class-item');
    let visible = 0;
    items.forEach(item => {
      const catMatch  = activeCategories.size === 0  || activeCategories.has(item.dataset.category);
      const instMatch = activeInstructors.size === 0 || activeInstructors.has(item.dataset.primaryInstructor);
      const show = item.dataset.location === activeLocation && catMatch && instMatch;
      item.classList.toggle('hidden', !show);
      if (show) visible++;
    });
    block.classList.toggle('hidden', visible === 0);
  });

  document.querySelectorAll('.cal-class-block').forEach(block => {
    const catMatch  = activeCategories.size === 0  || activeCategories.has(block.dataset.category);
    const instMatch = activeInstructors.size === 0 || activeInstructors.has(block.dataset.primaryInstructor);
    const show = block.dataset.location === activeLocation && catMatch && instMatch;
    block.classList.toggle('hidden', !show);
  });
}

// ── List view renderer ───────────────────────────────────

function renderSchedule(dateWindow) {
  const container = document.getElementById('schedule');
  container.innerHTML = '';

  dateWindow.forEach(entry => {
    const dayData = _scheduleByDay[entry.dayName] || { day: entry.dayName, classes: [] };
    const block = document.createElement('div');
    block.className = 'day-block';

    const header = document.createElement('div');
    header.className = 'day-header' + (entry.isToday ? ' day-header--today' : '');

    const labelSpan = document.createElement('span');
    labelSpan.textContent = entry.isToday
      ? 'Today'
      : (DAY_ABBREVS[entry.dayName] || entry.dayName);

    const dateSpan = document.createElement('span');
    dateSpan.className = 'day-header-date';
    dateSpan.textContent = entry.isToday
      ? (DAY_ABBREVS[entry.dayName] || entry.dayName) + ', ' + formatShortDate(entry.date)
      : formatShortDate(entry.date);

    header.appendChild(labelSpan);
    header.appendChild(dateSpan);
    block.appendChild(header);

    if (dayData.classes.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-day';
      empty.textContent = 'No classes scheduled';
      block.appendChild(empty);
    } else {
      const sorted = [...dayData.classes].sort((a, b) => a.time_start.localeCompare(b.time_start));
      sorted.forEach(cls => {
        const cat = typeToCategory[cls.type] || { id: 'unknown', color: 'gray' };
        const instColor = instructorColorMap[(cls.instructor_ids || [])[0]] || 'gray';
        const expired = isClassExpired(cls, entry);

        const item = document.createElement('div');
        item.className = `class-item bg-${cat.color}${expired ? ' past' : ''}`;
        item.dataset.category = cat.id;
        item.dataset.primaryInstructor = (cls.instructor_ids || [])[0] || '';
        item.dataset.location = cls.location_id;
        if (cls.type) item.dataset.type = cls.type;

        const bar = document.createElement('div');
        bar.className = `color-bar inst-${instColor}`;

        const body = document.createElement('div');
        body.className = 'class-body';

        const time = document.createElement('div');
        time.className = 'class-time';
        time.textContent = `${formatTime(cls.time_start)} – ${formatTime(cls.time_end)}`;

        const title = document.createElement('div');
        title.className = 'class-title';
        title.textContent = displayTitle(cls);

        const instructor = document.createElement('div');
        instructor.className = 'class-instructor';
        const names = cls.instructor_ids
          ? cls.instructor_ids.map(id => instructorMap[id] || id)
          : (cls.instructors || []);
        instructor.textContent = 'With ' + names.join(', ');

        body.appendChild(time);
        body.appendChild(title);
        body.appendChild(instructor);
        item.appendChild(bar);
        item.appendChild(body);
        item.dataset.classId = cls.id;
        item.dataset.dayName = entry.dayName;
        if (!expired) item.appendChild(buildBookingCTA(cls));
        block.appendChild(item);
      });
    }

    container.appendChild(block);
  });
}

document.getElementById('schedule').addEventListener('click', e => {
  // Book button — open booking confirmation modal
  const bookBtn = e.target.closest('.book-btn');
  if (bookBtn) {
    e.stopPropagation();
    openBookModal(bookBtn.dataset.classId, bookBtn.dataset.classTitle, bookBtn.dataset.classTime, bookBtn.dataset.pipeline, bookBtn.dataset.walletId);
    return;
  }
  // Booked button — open cancel confirmation modal
  const bookedBtn = e.target.closest('.booked-btn');
  if (bookedBtn) {
    e.stopPropagation();
    openCancelModal(bookedBtn.dataset.classId, bookedBtn.dataset.classTitle, bookedBtn.dataset.classTime);
    return;
  }
  // Booking CTA area — don't open description modal
  if (e.target.closest('.class-actions')) return;

  // Class description modal (or roll call for instructor's own class)
  const item = e.target.closest('.class-item[data-type]');
  if (!item) return;
  const s = PciAuth.getSession();
  if (s && s.role === 'instructor' && item.dataset.primaryInstructor === s.instructorId) {
    window.location.href = `instructor.html?classId=${encodeURIComponent(item.dataset.classId)}&day=${encodeURIComponent(item.dataset.dayName)}`;
    return;
  }
  const titleEl = item.querySelector('.class-title');
  openModal(item.dataset.type, titleEl ? titleEl.textContent : '');
});

// ── Calendar / Week view renderer ────────────────────────

function assignLanes(classes) {
  const sorted = [...classes].sort((a, b) => a.time_start.localeCompare(b.time_start));
  sorted.forEach(c => { c._lane = 0; c._totalLanes = 1; });

  function overlaps(a, b) {
    return a.time_start < b.time_end && b.time_start < a.time_end;
  }

  const visited = new Set();
  sorted.forEach((cls, i) => {
    if (visited.has(i)) return;
    const group = [i];
    visited.add(i);
    let changed = true;
    while (changed) {
      changed = false;
      sorted.forEach((other, j) => {
        if (visited.has(j)) return;
        if (group.some(k => overlaps(sorted[k], sorted[j]))) {
          group.push(j); visited.add(j); changed = true;
        }
      });
    }
    const laneEnds = [];
    group.map(k => sorted[k])
         .sort((a, b) => a.time_start.localeCompare(b.time_start))
         .forEach(c => {
           let lane = laneEnds.findIndex(end => c.time_start >= end);
           if (lane === -1) { lane = laneEnds.length; laneEnds.push(c.time_end); }
           else laneEnds[lane] = c.time_end;
           c._lane = lane;
         });
    group.forEach(k => { sorted[k]._totalLanes = laneEnds.length; });
  });
  return sorted;
}

function renderCalendarView(dateWindow) {
  const headerBar = document.getElementById('calDayHeaderBar');
  headerBar.querySelectorAll('.cal-day-head').forEach(el => el.remove());

  dateWindow.forEach(entry => {
    const cell = document.createElement('div');
    cell.className = 'cal-day-head' + (entry.isToday ? ' cal-day-head--today' : '');

    const nameEl = document.createElement('span');
    nameEl.className = 'cal-head-name';
    nameEl.textContent = entry.isToday ? 'Today' : (DAY_ABBREVS[entry.dayName] || entry.dayName.slice(0, 3));

    const numEl = document.createElement('span');
    numEl.className = 'cal-head-num';
    numEl.textContent = entry.date.getDate();

    cell.appendChild(nameEl);
    cell.appendChild(numEl);
    headerBar.appendChild(cell);
  });

  const inner = document.getElementById('calInner');
  inner.innerHTML = '';

  const totalHeight = TOTAL_HOURS * HOUR_HEIGHT;

  const gutter = document.createElement('div');
  gutter.className = 'cal-gutter';
  gutter.style.height = `${totalHeight}px`;

  for (let h = HOUR_START; h < HOUR_END; h++) {
    const label = document.createElement('div');
    label.className = 'cal-time-label';
    label.style.top = `${(h - HOUR_START) * HOUR_HEIGHT}px`;
    if (h === 12)     label.textContent = '12 PM';
    else if (h < 12)  label.textContent = `${h} AM`;
    else              label.textContent = `${h - 12} PM`;
    gutter.appendChild(label);
  }
  inner.appendChild(gutter);

  dateWindow.forEach(entry => {
    const dayData = _scheduleByDay[entry.dayName] || { day: entry.dayName, classes: [] };
    const col = document.createElement('div');
    col.className = 'cal-day-col';
    col.dataset.day = entry.dayName;
    col.style.height = `${totalHeight}px`;

    const byLoc = {};
    dayData.classes.forEach(c => (byLoc[c.location_id] = byLoc[c.location_id] || []).push(c));
    Object.values(byLoc).forEach(locClasses => assignLanes(locClasses));

    dayData.classes.forEach(cls => {
      const [sh, sm] = cls.time_start.split(':').map(Number);
      const [eh, em] = cls.time_end.split(':').map(Number);
      const startMin = Math.max(0, sh * 60 + sm - HOUR_START * 60);
      const endMin   = Math.min(TOTAL_HOURS * 60, eh * 60 + em - HOUR_START * 60);
      if (startMin >= endMin) return;

      const topPx    = (startMin / 60) * HOUR_HEIGHT;
      const heightPx = Math.max(((endMin - startMin) / 60) * HOUR_HEIGHT, 22);

      const cat = typeToCategory[cls.type] || { id: 'unknown', color: 'gray' };
      const instColor = instructorColorMap[(cls.instructor_ids || [])[0]] || 'gray';
      const expired = isClassExpired(cls, entry);

      const block = document.createElement('div');
      block.className = `cal-class-block color-${cat.color} inst-${instColor}${expired ? ' past' : ''}`;
      block.dataset.category = cat.id;
      block.dataset.primaryInstructor = (cls.instructor_ids || [])[0] || '';
      block.dataset.location = cls.location_id;
      if (cls.type) block.dataset.type = cls.type;
      block.dataset.classId = cls.id;
      block.dataset.dayName = entry.dayName;
      block.style.top    = `${topPx}px`;
      block.style.height = `${heightPx}px`;

      const gap = 2;
      const pct = 100 / cls._totalLanes;
      block.style.left  = `calc(${cls._lane * pct}% + ${gap}px)`;
      block.style.width = `calc(${pct}% - ${gap * 2}px)`;
      block.style.right = '';

      const timeEl = document.createElement('div');
      timeEl.className = 'cal-block-time';
      timeEl.textContent = formatTime(cls.time_start);

      const titleEl = document.createElement('div');
      titleEl.className = 'cal-block-title';
      titleEl.textContent = displayTitle(cls);

      block.appendChild(timeEl);
      block.appendChild(titleEl);

      if (cls.sub_location === 'upper_gym') {
        const tag = document.createElement('div');
        tag.className = 'cal-block-gym-tag';
        tag.textContent = '↑ Upper';
        block.appendChild(tag);
      }

      col.appendChild(block);
    });

    inner.appendChild(col);
  });
}

document.getElementById('calView').addEventListener('click', e => {
  const block = e.target.closest('.cal-class-block[data-type]');
  if (!block) return;
  const s = PciAuth.getSession();
  if (s && s.role === 'instructor' && block.dataset.primaryInstructor === s.instructorId) {
    window.location.href = `instructor.html?classId=${encodeURIComponent(block.dataset.classId)}&day=${encodeURIComponent(block.dataset.dayName)}`;
    return;
  }
  const titleEl = block.querySelector('.cal-block-title');
  openModal(block.dataset.type, titleEl ? titleEl.textContent : '');
});

// Keep the sticky cal header in sync with horizontal scroll (wired once)
document.getElementById('calScroll').addEventListener('scroll', function () {
  document.getElementById('calDayHeaderBar').scrollLeft = this.scrollLeft;
});

// ── Re-render both views for a new date window ───────────────────────────────
function rerenderViews() {
  const dateWindow = buildDateWindow(_viewStartDate);
  updateDateNav(dateWindow);
  renderSchedule(dateWindow);
  renderCalendarView(dateWindow);
  if (currentView === 'bookings') renderMyBookings();
  applyFilter();
}

// ── Date nav controls ─────────────────────────────────────────────────────────
document.getElementById('prevWeek').addEventListener('click', () => {
  _viewStartDate = dateAddDays(_viewStartDate, -7);
  saveViewDate();
  rerenderViews();
});

document.getElementById('nextWeek').addEventListener('click', () => {
  _viewStartDate = dateAddDays(_viewStartDate, 7);
  saveViewDate();
  rerenderViews();
});

document.getElementById('goToToday').addEventListener('click', () => {
  _viewStartDate = todayMidnight();
  saveViewDate();
  rerenderViews();
});

document.getElementById('datePicker').addEventListener('change', e => {
  const val = e.target.value; // YYYY-MM-DD
  if (!val) return;
  const [y, m, d] = val.split('-').map(Number);
  const picked = new Date(y, m - 1, d);
  picked.setHours(0, 0, 0, 0);
  _viewStartDate = picked;
  saveViewDate();
  rerenderViews();
});

// ── Bootstrap ────────────────────────────────────────────

Promise.all([
  fetch('pci_schedule.json', { cache: 'no-store' }).then(r => r.json()),
  fetch('data/class_types.json', { cache: 'no-store' }).then(r => r.json()),
  fetch('data/instructors.json', { cache: 'no-store' }).then(r => r.json()),
  fetch('data/categories.json', { cache: 'no-store' }).then(r => r.json())
])
  .then(([scheduleData, classTypesData, instructorsData, categoriesData]) => {
    instructorsData.instructors.forEach(i => {
      instructorMap[i.id] = i.display_name;
      instructorColorMap[i.id] = i.color;
    });
    classTypesData.class_types.forEach(ct => {
      classDescriptions[ct.id] = { name: ct.name, description: ct.description };
    });
    _allCategories = categoriesData.categories;
    typeToCategory = buildTypeToCategory(categoriesData.categories);
    scheduleData.schedule.forEach(day => {
      _scheduleByDay[day.day] = day;
      day.classes.forEach(cls => {
        const cat = typeToCategory[cls.type];
        if (cat) locationCategories[cls.location_id]?.add(cat.id);
        (cls.instructor_ids || []).forEach(id => locationInstructors[cls.location_id]?.add(id));
        _allClasses.push(cls);
      });
    });

    initViewDate();
    buildCategoryFilter(categoriesData);
    buildInstructorFilter(instructorsData.instructors);
    const dateWindow = buildDateWindow(_viewStartDate);
    updateDateNav(dateWindow);
    renderSchedule(dateWindow);
    renderCalendarView(dateWindow);
    setLocation(_initialLocation);
  })
  .catch(err => {
    document.getElementById('schedule').textContent = 'Failed to load schedule.';
    console.error(err);
  });
</script>
