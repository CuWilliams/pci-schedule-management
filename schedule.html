<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power Conditioning Inc. — Weekly Schedule</title>
  <link rel="stylesheet" href="pci-tokens.css">
  <style>
    body {
      background: var(--bg);
      color: var(--text);
    }

    /* ── Topbar (schedule-specific overrides; base in pci-tokens.css) ────── */
    .topbar-logo { flex: 1; text-align: center; font-weight: 900; letter-spacing: 0.10em; }

    /* ── View toggle ──────────────────────────────────────── */
    .view-toggle {
      display: flex;
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .view-btn {
      padding: 4px 10px;
      background: transparent;
      border: none;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.45);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-family: var(--font-body);
    }
    .view-btn + .view-btn { border-left: 1.5px solid rgba(255,255,255,0.18); }
    .view-btn.active { background: var(--brand); color: var(--pci-white); }

    /* ── Admin link (topbar context) ─────────────────────── */
    .topbar-admin {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border: 1.5px solid rgba(255,255,255,0.14);
      border-radius: var(--radius-sm);
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .topbar-admin:hover { border-color: rgba(255,255,255,0.40); color: var(--pci-white); }
    .topbar-admin.logged-in { border-color: var(--success); color: var(--success); }
    .topbar-admin svg { width: 13px; height: 13px; flex-shrink: 0; }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
    }

    /* ── Location tabs ────────────────────────────────────── */
    .location-tabs {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 0 12px;
      position: sticky;
      top: 52px;   /* topbar height */
      z-index: 9;
      display: flex;
      gap: 0;
    }

    /* ── Filter bar ───────────────────────────────────────── */
    .filter-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      position: sticky;
      top: 90px;   /* topbar 52 + location-tabs ~38 */
      z-index: 9;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    /* ── List view ────────────────────────────────────────── */
    .schedule {
      max-width: 600px;
      margin: 0 auto;
      padding: 12px 10px 40px;
    }

    .day-block {
      margin-bottom: 16px;
      background: var(--surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .day-header {
      background: var(--gray-700);
      color: var(--pci-white);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 8px 12px;
    }

    .class-item {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--border);
    }
    .class-item:last-child { border-bottom: none; }

    .class-body { padding: 8px 10px; flex: 1; }

    .class-time {
      font-size: 11px;
      font-weight: 700;
      color: var(--gray-600);
      margin-bottom: 2px;
      letter-spacing: 0.02em;
    }

    .class-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-900);
      line-height: 1.3;
      margin-bottom: 2px;
    }

    .class-instructor {
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
    }

    footer {
      text-align: center;
      font-size: 11px;
      color: var(--gray-400);
      padding: 16px;
    }

    .class-item.hidden  { display: none; }
    .day-block.hidden   { display: none; }
    .class-item[data-type] { cursor: pointer; }
    .class-item[data-type]:hover .class-body { background: rgba(0,0,0,0.02); }

    /* ── Modal ────────────────────────────────────────────── */
    .modal-sheet {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 20px;
      max-width: 480px;
      width: calc(100% - 32px);
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 16px;
      color: var(--gray-500);
      cursor: pointer;
      padding: 0 2px;
      flex-shrink: 0;
      line-height: 1;
    }
    .modal-close:hover { color: var(--gray-800); }

    .modal-desc {
      font-size: 13px;
      line-height: 1.6;
      color: var(--gray-600);
    }

    @media (max-width: 600px) {
      .modal-sheet {
        width: 100%;
        max-width: none;
        border-radius: 16px 16px 0 0;
        animation: slideUp 0.22s ease-out;
      }
    }

    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }

    /* ── Calendar / Week view ─────────────────────────────── */
    #calView { display: none; }

    .cal-day-header-bar {
      display: flex;
      align-items: stretch;
      background: var(--surface);
      border-bottom: 2px solid var(--gray-300);
      position: sticky;
      top: 133px; /* topbar 52 + loc-tabs 38 + filter-bar 43 */
      z-index: 8;
      overflow: hidden;
    }

    .cal-gutter-cell {
      width: 44px;
      flex-shrink: 0;
    }

    .cal-day-head {
      flex: 1;
      min-width: 90px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray-600);
      padding: 7px 2px;
    }

    .cal-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      padding-bottom: 40px;
    }

    .cal-inner {
      display: flex;
      min-width: 674px;
    }

    .cal-gutter {
      width: 44px;
      flex-shrink: 0;
      position: relative;
    }

    .cal-time-label {
      position: absolute;
      right: 6px;
      font-size: 10px;
      color: var(--gray-400);
      font-weight: 600;
      transform: translateY(-50%);
      white-space: nowrap;
    }

    .cal-day-col {
      flex: 1;
      min-width: 90px;
      position: relative;
      border-left: 1px solid var(--gray-200);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 31px,
        #ececec 31px,
        #ececec 32px,
        transparent 32px,
        transparent 63px,
        #d4d4d4 63px,
        #d4d4d4 64px
      );
      background-size: 100% 64px;
    }

    .cal-class-block {
      position: absolute;
      left: 2px;
      right: 2px;
      border-radius: var(--radius-sm);
      padding: 3px 4px 3px 6px;
      overflow: hidden;
      cursor: pointer;
      border-left-width: 3px;
      border-left-style: solid;
      transition: opacity 0.1s;
    }
    .cal-class-block:hover { opacity: 0.75; }

    .cal-block-time {
      font-size: 9px;
      font-weight: 700;
      color: var(--gray-600);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .cal-block-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--gray-800);
      line-height: 1.25;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .cal-block-gym-tag {
      font-size: 8px;
      font-weight: 700;
      color: var(--gray-600);
      margin-top: 2px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .cal-class-block.hidden { display: none; }
  </style>
</head>
<body>
<div id="phoneFrame">
<div id="phoneViewport">

<header class="topbar">
  <a href="index.html" class="topbar-back">← Home</a>
  <div class="topbar-logo">Power Conditioning Inc.</div>
  <div class="topbar-actions">
    <button class="nav-menu-btn" id="navMenuBtn" aria-label="Open navigation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="view-toggle" id="viewToggle">
      <button class="view-btn active" data-view="list">List</button>
      <button class="view-btn" data-view="week">Week</button>
    </div>
    <button class="dev-mode-btn" id="devModeBtn" aria-label="Toggle mobile view" title="Toggle phone viewport simulation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      Mobile

    <a class="topbar-admin" id="adminLink" href="admin.html" title="Admin">

      Admin

      List
    </button>
    <button class="nav-drawer-item" data-nav-view="week">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Week

      Clarenville Center
    </a>

    <a class="nav-drawer-item" href="admin.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>

</header>

<div class="location-tabs" id="locationTabs">
  <button class="loc-tab active" data-loc="stjohns">St. John's</button>
  <button class="loc-tab" data-loc="clarenville">Clarenville</button>
</div>

<div class="filter-bar" id="filterBar"></div>

<div class="schedule" id="schedule"></div>

<div id="calView">
  <div class="cal-day-header-bar" id="calDayHeaderBar">
    <div class="cal-gutter-cell"></div>
  </div>

    <div class="cal-inner" id="calInner"></div>

</div>

<footer>Power Conditioning Inc.</footer>

<div id="descModal" class="modal-overlay" role="dialog" aria-modal="true" hidden>
  <div class="modal-sheet">
    <div class="modal-header">
      <span id="modalTitle" class="modal-title"></span>
      <button class="modal-close" id="modalClose" aria-label="Close">&#x2715;</button>
    </div>
    <p id="modalDesc" class="modal-desc"></p>
  </div>
</div>

<script src="pci-shared.js"></script>
<script>
const DEV_MODE_KEY = 'pci_dev_mobile';
function applyDevMode(enabled) {
  document.body.classList.toggle('dev-mobile', enabled);
  const btn = document.getElementById('devModeBtn');
  if (btn) btn.classList.toggle('active', enabled);
  enabled
    ? localStorage.setItem(DEV_MODE_KEY, '1')
    : localStorage.removeItem(DEV_MODE_KEY);
}
applyDevMode(localStorage.getItem(DEV_MODE_KEY) === '1');
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('devModeBtn')?.addEventListener('click', () => {
    applyDevMode(!document.body.classList.contains('dev-mobile'));
  });
});

// Show logged-in state if PAT already stored from admin session
(function () {
  if (localStorage.getItem('pci_admin_pat')) {
    const link = document.getElementById('adminLink');
    const dot  = document.getElementById('adminDot');
    if (link) { link.classList.add('logged-in'); link.title = 'Admin (signed in)'; }
    if (dot)  dot.style.display = '';
  }
})();

// Pre-select location from URL param (?loc=stjohns | ?loc=clarenville)
const _urlLoc = new URLSearchParams(location.search).get('loc');
const _initialLocation = (_urlLoc === 'clarenville') ? 'clarenville' : 'stjohns';

let classDescriptions = {};
let instructorMap = {};

const DAY_ABBREVS = {
  Sunday: 'Sun', Monday: 'Mon', Tuesday: 'Tue', Wednesday: 'Wed',
  Thursday: 'Thu', Friday: 'Fri', Saturday: 'Sat'
};

const HOUR_START  = 5;
const HOUR_END    = 21;
const HOUR_HEIGHT = 64;
const TOTAL_HOURS = HOUR_END - HOUR_START;

function formatTime(t) {
  const [h, m] = t.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const hour = h % 12 || 12;
  return `${hour}:${m.toString().padStart(2,'0')} ${period}`;
}

function displayTitle(cls) {
  return cls.title
    .replace(/^St\.\s*John's\s+/i, '')
    .replace(/^Clarenville\s+/i, '');
}

function openModal(typeKey, classTitle) {
  const desc = classDescriptions[typeKey];
  if (!desc) return;
  document.getElementById('modalTitle').textContent = classTitle;
  document.getElementById('modalDesc').textContent = desc.description;
  document.getElementById('descModal').removeAttribute('hidden');
}

function closeModal() {
  document.getElementById('descModal').setAttribute('hidden', '');
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('descModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── View toggle ──────────────────────────────────────────

let currentView = 'list';

function toggleView(view) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === view);
  });
  document.querySelectorAll('[data-nav-view]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.navView === view);
  });
  document.getElementById('schedule').style.display = view === 'list' ? '' : 'none';
  document.getElementById('calView').style.display  = view === 'week' ? 'block' : 'none';
}

document.getElementById('viewToggle').addEventListener('click', e => {
  const btn = e.target.closest('.view-btn');
  if (btn) toggleView(btn.dataset.view);
});

// ── Hamburger nav drawer ──────────────────────────────────
const navMenuBtn = document.getElementById('navMenuBtn');
const navDrawer  = document.getElementById('navDrawer');

navMenuBtn.addEventListener('click', e => {
  e.stopPropagation();
  const opening = !navDrawer.classList.contains('open');
  navDrawer.classList.toggle('open', opening);
  navMenuBtn.setAttribute('aria-label', opening ? 'Close navigation' : 'Open navigation');
});

navDrawer.addEventListener('click', e => {
  const item = e.target.closest('[data-nav-view]');
  if (item) { toggleView(item.dataset.navView); navDrawer.classList.remove('open'); return; }
  if (e.target.closest('a')) navDrawer.classList.remove('open');
});

document.addEventListener('click', e => {
  if (!navDrawer.contains(e.target) && !navMenuBtn.contains(e.target)) {
    navDrawer.classList.remove('open');
  }
});

// ── Location tabs ─────────────────────────────────────────

let activeLocation = 'stjohns';
const locationColors = { stjohns: new Set(), clarenville: new Set() };

function setLocation(loc) {
  activeLocation = loc;

  document.querySelectorAll('.loc-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.loc === loc);
  });

  activeCategories.clear();
  document.querySelectorAll('.filter-pill').forEach(p => {
    if (p.dataset.color === 'all') {
      p.classList.add('active');
      p.style.display = '';
    } else {
      const visible = locationColors[loc]?.has(p.dataset.color);
      p.style.display = visible ? '' : 'none';
      p.classList.remove('active');
    }
  });

  applyFilter();
}

document.getElementById('locationTabs').addEventListener('click', e => {
  const tab = e.target.closest('.loc-tab');
  if (tab) setLocation(tab.dataset.loc);
});

// ── Filter bar ───────────────────────────────────────────

let activeCategories = new Set();

function buildFilterBar(categories) {
  const bar = document.getElementById('filterBar');

  const clearPill = document.createElement('button');
  clearPill.className = 'filter-pill active';
  clearPill.dataset.color = 'all';
  clearPill.textContent = 'All';
  bar.appendChild(clearPill);

  Object.entries(categories).forEach(([color, label]) => {
    const pill = document.createElement('button');
    pill.className = 'filter-pill';
    pill.dataset.color = color;
    pill.title = label;

    const dot = document.createElement('span');
    dot.className = 'pill-dot';
    dot.style.backgroundColor = COLOR_HEX[color] || '#999';

    pill.appendChild(dot);
    pill.appendChild(document.createTextNode(color.charAt(0).toUpperCase() + color.slice(1)));
    bar.appendChild(pill);
  });

  bar.addEventListener('click', e => {
    const pill = e.target.closest('.filter-pill');
    if (!pill) return;

    if (pill.dataset.color === 'all') {
      activeCategories.clear();
    } else {
      if (activeCategories.has(pill.dataset.color)) {
        activeCategories.delete(pill.dataset.color);
      } else {
        activeCategories.add(pill.dataset.color);
      }
    }

    bar.querySelectorAll('.filter-pill').forEach(p => {
      if (p.dataset.color === 'all') {
        p.classList.toggle('active', activeCategories.size === 0);
      } else {
        p.classList.toggle('active', activeCategories.has(p.dataset.color));
      }
    });

    applyFilter();
  });
}

function applyFilter() {
  document.querySelectorAll('.day-block').forEach(block => {
    const items = block.querySelectorAll('.class-item');
    let visible = 0;
    items.forEach(item => {
      const show = item.dataset.location === activeLocation
                && (activeCategories.size === 0 || activeCategories.has(item.dataset.color));
      item.classList.toggle('hidden', !show);
      if (show) visible++;
    });
    block.classList.toggle('hidden', visible === 0);
  });

  document.querySelectorAll('.cal-class-block').forEach(block => {
    const show = block.dataset.location === activeLocation
              && (activeCategories.size === 0 || activeCategories.has(block.dataset.color));
    block.classList.toggle('hidden', !show);
  });
}

// ── List view renderer ───────────────────────────────────

function renderSchedule(schedule) {
  const container = document.getElementById('schedule');

  schedule.forEach(day => {
    const block = document.createElement('div');
    block.className = 'day-block';

    const header = document.createElement('div');
    header.className = 'day-header';
    header.textContent = day.day;
    block.appendChild(header);

    if (day.classes.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-day';
      empty.textContent = 'No classes scheduled';
      block.appendChild(empty);
    } else {
      const sorted = [...day.classes].sort((a, b) => a.time_start.localeCompare(b.time_start));
      sorted.forEach(cls => {
        const item = document.createElement('div');
        item.className = `class-item bg-${cls.color}`;
        item.dataset.color = cls.color;
        item.dataset.location = cls.location_id;
        if (cls.type) item.dataset.type = cls.type;

        const bar = document.createElement('div');
        bar.className = `color-bar color-${cls.color}`;

        const body = document.createElement('div');
        body.className = 'class-body';

        const time = document.createElement('div');
        time.className = 'class-time';
        time.textContent = `${formatTime(cls.time_start)} – ${formatTime(cls.time_end)}`;

        const title = document.createElement('div');
        title.className = 'class-title';
        title.textContent = displayTitle(cls);

        const instructor = document.createElement('div');
        instructor.className = 'class-instructor';
        const names = cls.instructor_ids
          ? cls.instructor_ids.map(id => instructorMap[id] || id)
          : (cls.instructors || []);
        instructor.textContent = 'With ' + names.join(', ');

        body.appendChild(time);
        body.appendChild(title);
        body.appendChild(instructor);
        item.appendChild(bar);
        item.appendChild(body);
        block.appendChild(item);
      });
    }

    container.appendChild(block);
  });
}

// ── Calendar / Week view renderer ────────────────────────

function assignLanes(classes) {
  const sorted = [...classes].sort((a, b) => a.time_start.localeCompare(b.time_start));
  sorted.forEach(c => { c._lane = 0; c._totalLanes = 1; });

  function overlaps(a, b) {
    return a.time_start < b.time_end && b.time_start < a.time_end;
  }

  const visited = new Set();
  sorted.forEach((cls, i) => {
    if (visited.has(i)) return;
    const group = [i];
    visited.add(i);
    let changed = true;
    while (changed) {
      changed = false;
      sorted.forEach((other, j) => {
        if (visited.has(j)) return;
        if (group.some(k => overlaps(sorted[k], sorted[j]))) {
          group.push(j); visited.add(j); changed = true;
        }
      });
    }
    const laneEnds = [];
    group.map(k => sorted[k])
         .sort((a, b) => a.time_start.localeCompare(b.time_start))
         .forEach(c => {
           let lane = laneEnds.findIndex(end => c.time_start >= end);
           if (lane === -1) { lane = laneEnds.length; laneEnds.push(c.time_end); }
           else laneEnds[lane] = c.time_end;
           c._lane = lane;
         });
    group.forEach(k => { sorted[k]._totalLanes = laneEnds.length; });
  });
  return sorted;
}

function renderCalendarView(schedule) {
  const headerBar = document.getElementById('calDayHeaderBar');
  schedule.forEach(day => {
    const cell = document.createElement('div');
    cell.className = 'cal-day-head';
    cell.textContent = DAY_ABBREVS[day.day] || day.day;
    headerBar.appendChild(cell);
  });

  const calScroll = document.getElementById('calScroll');
  calScroll.addEventListener('scroll', () => {
    headerBar.scrollLeft = calScroll.scrollLeft;
  });

  const inner = document.getElementById('calInner');
  const totalHeight = TOTAL_HOURS * HOUR_HEIGHT;

  const gutter = document.createElement('div');
  gutter.className = 'cal-gutter';
  gutter.style.height = `${totalHeight}px`;

  for (let h = HOUR_START; h < HOUR_END; h++) {
    const label = document.createElement('div');
    label.className = 'cal-time-label';
    label.style.top = `${(h - HOUR_START) * HOUR_HEIGHT}px`;
    if (h === 12)     label.textContent = '12 PM';
    else if (h < 12)  label.textContent = `${h} AM`;
    else              label.textContent = `${h - 12} PM`;
    gutter.appendChild(label);
  }
  inner.appendChild(gutter);

  schedule.forEach(day => {
    const col = document.createElement('div');
    col.className = 'cal-day-col';
    col.dataset.day = day.day;
    col.style.height = `${totalHeight}px`;

    const byLoc = {};
    day.classes.forEach(c => (byLoc[c.location_id] = byLoc[c.location_id] || []).push(c));
    Object.values(byLoc).forEach(locClasses => assignLanes(locClasses));

    day.classes.forEach(cls => {
      const [sh, sm] = cls.time_start.split(':').map(Number);
      const [eh, em] = cls.time_end.split(':').map(Number);
      const startMin = Math.max(0, sh * 60 + sm - HOUR_START * 60);
      const endMin   = Math.min(TOTAL_HOURS * 60, eh * 60 + em - HOUR_START * 60);
      if (startMin >= endMin) return;

      const topPx    = (startMin / 60) * HOUR_HEIGHT;
      const heightPx = Math.max(((endMin - startMin) / 60) * HOUR_HEIGHT, 22);

      const block = document.createElement('div');
      block.className = `cal-class-block color-${cls.color}`;
      block.dataset.color = cls.color;
      block.dataset.location = cls.location_id;
      if (cls.type) block.dataset.type = cls.type;
      block.style.top    = `${topPx}px`;
      block.style.height = `${heightPx}px`;

      const gap = 2;
      const pct = 100 / cls._totalLanes;
      block.style.left  = `calc(${cls._lane * pct}% + ${gap}px)`;
      block.style.width = `calc(${pct}% - ${gap * 2}px)`;
      block.style.right = '';

      const timeEl = document.createElement('div');
      timeEl.className = 'cal-block-time';
      timeEl.textContent = formatTime(cls.time_start);

      const titleEl = document.createElement('div');
      titleEl.className = 'cal-block-title';
      titleEl.textContent = displayTitle(cls);

      block.appendChild(timeEl);
      block.appendChild(titleEl);

      if (cls.sub_location === 'upper_gym') {
        const tag = document.createElement('div');
        tag.className = 'cal-block-gym-tag';
        tag.textContent = '↑ Upper';
        block.appendChild(tag);
      }

      col.appendChild(block);
    });

    inner.appendChild(col);
  });
}

document.getElementById('calView').addEventListener('click', e => {
  const block = e.target.closest('.cal-class-block[data-type]');
  if (!block) return;
  const titleEl = block.querySelector('.cal-block-title');

});

Promise.all([
  fetch('pci_schedule.json').then(r => r.json()),
  fetch('data/class_types.json').then(r => r.json()),
  fetch('data/instructors.json').then(r => r.json())
])
  .then(([scheduleData, classTypesData, instructorsData]) => {
    instructorsData.instructors.forEach(i => { instructorMap[i.id] = i.display_name; });
    classTypesData.class_types.forEach(ct => {
      classDescriptions[ct.id] = { name: ct.name, description: ct.description };
    });
    scheduleData.schedule.forEach(day =>
      day.classes.forEach(cls => {
        if (locationColors[cls.location_id]) locationColors[cls.location_id].add(cls.color);
      })
    );

    buildFilterBar(classTypesData.class_categories);
    renderSchedule(scheduleData.schedule);
    renderCalendarView(scheduleData.schedule);
    setLocation(_initialLocation);
  })
  .catch(err => {
    document.getElementById('schedule').textContent = 'Failed to load schedule.';
    console.error(err);
  });
