      color: #fff;
      font-size: 13px;
      font-weight: 700;

    .class-item {

      align-items: stretch;
      border-bottom: 1px solid #e8e8e8;
    }

    }

    .color-bar {

    .class-body {

    }

    .class-title {

    .class-instructor {

    .color-yellow { background-color: #E8C840; }
    .color-orange { background-color: #E8803A; }

    .bg-orange { background-color: #fef3ea; }

    .bg-gray   { background-color: #f5f5f5; }

      color: #aaa;
      font-size: 12px;
      font-style: italic;
      text-align: center;

function formatTime(t) {
  const [h, m] = t.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const hour = h % 12 || 12;
  return `${hour}:${m.toString().padStart(2,'0')} ${period}`;
}

const container = document.getElementById('schedule');

schedule.forEach(day => {

  block.className = 'day-block';

  const header = document.createElement('div');
  header.className = 'day-header';
  header.textContent = day.day;
  block.appendChild(header);

  if (day.classes.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-day';
    empty.textContent = 'No classes scheduled';
    block.appendChild(empty);
  } else {
    // Sort by time
    const sorted = [...day.classes].sort((a, b) => a.time_start.localeCompare(b.time_start));
    sorted.forEach(cls => {
      const item = document.createElement('div');
      item.className = `class-item bg-${cls.color}`;

      const bar = document.createElement('div');
      bar.className = `color-bar color-${cls.color}`;

      const body = document.createElement('div');
      body.className = 'class-body';

      const time = document.createElement('div');
      time.className = 'class-time';
      time.textContent = `${formatTime(cls.time_start)} – ${formatTime(cls.time_end)}`;

      const title = document.createElement('div');
      title.className = 'class-title';
      title.textContent = cls.title;

      const instructor = document.createElement('div');
      instructor.className = 'class-instructor';
      instructor.textContent = 'With ' + cls.instructors.join(', ');

      body.appendChild(time);
      body.appendChild(title);
      body.appendChild(instructor);
      item.appendChild(bar);
      item.appendChild(body);
      block.appendChild(item);
    });
  }
